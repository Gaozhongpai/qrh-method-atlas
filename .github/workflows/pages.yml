name: Sync leaderboard and publish Pages

on:
  push:
    branches: [main]
  schedule:
    # Offset from the busy start of the hour. GitHub schedules may be delayed.
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-catalogue-updated]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check sync behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh the official catalogue
        run: python3 scripts/sync_catalogue.py
      - name: Check the website JavaScript
        run: node --check dist/app.js && node --check dist/theme.js
      - name: Check the generated colour themes are current
        run: python3 scripts/build_dark_theme.py && git diff --exit-code dist/theme.css dist/theme-map.js
      - name: Check mathematical visualization models
        run: node --test scripts/test_capacity.mjs scripts/test_bottleneck.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the refreshed static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
